name: Products CI

on:
  push:
    branches: [master]
    paths:
      - 'products/**'
  pull_request:
    branches: [master]
    paths:
      - 'products/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            jsonpretty:
              - 'products/jsonpretty/**'
            qrcraft:
              - 'products/qrcraft/**'

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.products != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: ${{ fromJson(needs.detect-changes.outputs.products) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: products/${{ matrix.product }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: products/${{ matrix.product }}
        run: pnpm install --ignore-workspace

      - name: Build
        working-directory: products/${{ matrix.product }}
        run: pnpm build

      - name: Test
        working-directory: products/${{ matrix.product }}
        run: pnpm test --if-present
